<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mây Coffee Roasters</title>
    <meta name="description" content="A small-batch specialty coffee roastery in Đà Lạt — six single origins and two blends, sold whole bean or ground, with wholesale for cafés." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mây Coffee Roasters" />
    <meta property="og:description" content="A small-batch specialty coffee roastery in Đà Lạt — six single origins and two blends, sold whole bean or ground, with wholesale for cafés." />
    <meta property="og:image" content="/images/hero-roaster.jpg" />
    <script>
      // Light or dark, before the first paint so the page never flashes the
      // other mode: the visitor's stored choice (src/components/ThemeToggle.tsx),
      // else the site's default (content.json site.defaultMode, written onto
      // the html element as data-default-mode by vite.config.ts), else
      // nothing — the visitor's own system setting.
      (function () {
        var d = document.documentElement, t = null;
        try {
          t = localStorage.getItem("theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = d.getAttribute("data-default-mode");
        if (t === "light" || t === "dark") d.dataset.theme = t;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
